name: Delete temporary cleanup branch once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-short-game-foundation-branch-once.yml

permissions:
  contents: write

jobs:
  delete-branch:
    if: contains(github.event.head_commit.message, '[delete cleanup branch]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary cleanup branch and verify
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = 'ops/delete-short-game-branch-20260725';

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`
              });
              core.info(`deleted: ${branch}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.info(`already absent: ${branch}`);
            }

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${branch}`
              });
              core.setFailed(`branch still exists: ${branch}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.info(`verified absent: ${branch}`);
            }
