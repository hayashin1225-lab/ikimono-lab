name: Branch cleanup once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[run branch cleanup]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged and obsolete remote branches
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              'codex/issue-13-liaison-officer-mvp',
              'codex/issue-20-docs-add-liaison-officer-pilot-note',
              'codex/issue-33-fix-liaison-diagnostics',
              'docs/ai-collaboration-platform-canon',
              'docs/ip-master-canon-v0.3',
              'docs/lead-coding-operating-model',
              'docs/model-selection-escalation-policy',
              'fix/liaison-default-config-path',
              'fix/liaison-default-config-path-2',
              'fix/liaison-default-config-path-final',
              'ops/branch-cleanup-runner-20260725'
            ];

            const preserved = new Set([
              'main',
              'agent/issue-24-short-game-foundation',
              'archive/codex-sites-deployment'
            ]);

            const { owner, repo } = context.repo;
            const failures = [];

            for (const branch of branches) {
              if (preserved.has(branch)) {
                failures.push(`refused to delete preserved branch: ${branch}`);
                continue;
              }

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`
                });
                core.info(`deleted: ${branch}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`already absent: ${branch}`);
                } else {
                  failures.push(`${branch}: ${error.status || 'error'} ${error.message}`);
                }
              }
            }

            for (const branch of branches) {
              try {
                await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`
                });
                failures.push(`still exists: ${branch}`);
              } catch (error) {
                if (error.status !== 404) {
                  failures.push(`verification failed for ${branch}: ${error.status || 'error'} ${error.message}`);
                }
              }
            }

            for (const branch of preserved) {
              if (branch === 'archive/codex-sites-deployment') {
                continue;
              }
              try {
                await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`
                });
                core.info(`preserved: ${branch}`);
              } catch (error) {
                if (error.status === 404) {
                  failures.push(`preserved branch missing: ${branch}`);
                } else {
                  failures.push(`preserved branch check failed for ${branch}: ${error.status || 'error'} ${error.message}`);
                }
              }
            }

            if (failures.length > 0) {
              core.setFailed(failures.join('\n'));
            }
